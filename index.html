      <h1>Agentic AI Master Guide</h1>
      <p>An interactive guide that teaches agentic AI by building. In the Workflow Builder you design an agent, run it against tests, read the trace when it fails and fix the design until every test passes.</p>
      <ul>
        <li><strong>Workflow Builder:</strong> six buildable patterns (router, RAG, tool-using agent, answer + critic, human approval, memory), each with tests covering prompt injection, poisoned memory, made-up answers, runaway loops and data leaks.</li>
        <li><strong>183 connected concepts</strong>, from foundations to harness engineering, context compaction, MCP, A2A, AG-UI, guardrails and agent drift. Each one includes a failure mode.</li>
        <li><strong>Learning paths</strong> for beginners, developers and researchers, plus 11 guided projects and a quiz.</li>
      </ul>
      <p>Everything runs in your browser with no API key or backend. <strong>Please enable JavaScript to use the guide.</strong></p>
